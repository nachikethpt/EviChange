<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EviChange GIS</title>
  <link rel="stylesheet" href="/static/vendor/maplibre-gl.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">◆</span> EviChange GIS <span class="tag">starter v0.1</span></div>
    <nav class="toolbar" id="toolbar">
      <button data-tool="add"      title="Add GeoJSON or zipped shapefile">＋ Add data</button>
      <button data-tool="basemap"  title="Choose basemap">▦ Basemap</button>
      <button data-tool="measure"  title="Measure distance or area">📏 Measure</button>
      <button data-tool="draw"     title="Draw an area and analyse change inside it">✎ Draw area</button>
      <button data-tool="swipe"    title="Compare two images with a swipe bar">⇆ Swipe</button>
      <button data-tool="table"    title="Open the attribute table">☰ Table</button>
      <button data-tool="indices"  title="Add vegetation / bare ground / water index layers from Earth Engine">◐ Indices</button>
      <button data-tool="tools"    title="Select by attributes or location; buffer, clip, intersect, dissolve">⚙ Tools</button>
      <button data-tool="charts"   title="Charts linked to the map">📊 Charts</button>
      <button data-tool="print"    title="Export layers or print a map layout">🖨 Export</button>
      <button data-tool="changes"  title="Find and explain the changes in an area">🔎 Find changes</button>
      <button data-tool="report" class="primary" title="AI change report">✦ AI report</button>
    </nav>
  </header>

  <main class="layout">
    <aside class="contents" id="contents">
      <div class="pane-title">Contents</div>
      <div id="layerList"></div>
      <div class="legend" id="legend"></div>
    </aside>

    <section class="mapwrap" id="mapwrap">
      <div id="map"></div>
      <div id="swipeMap" hidden></div>
      <div id="swipeHandle" hidden><span>⇆</span></div>
      <div class="hint" id="hint" hidden></div>
      <div class="statusbar" id="statusbar">Move the mouse over the map</div>
    </section>

    <aside class="panel" id="panel" hidden>
      <div class="panel-head"><span id="panelTitle"></span><button class="icon" id="panelClose" title="Close">✕</button></div>
      <div class="panel-body" id="panelBody"></div>
    </aside>
  </main>

  <section class="tablepane" id="tablepane" hidden>
    <div class="table-head">
      <strong>Attribute table</strong>
      <select id="tableLayer"></select>
      <span id="tableCount" class="muted"></span>
      <button class="icon" id="tableClose" title="Close">✕</button>
    </div>
    <div class="table-scroll"><table id="attrTable"></table></div>
  </section>

  <input type="file" id="fileInput" accept=".geojson,.json,.zip" hidden>

  <script src="/static/vendor/maplibre-gl.js"></script>
  <script src="/static/vendor/turf.min.js"></script>
  <script src="/static/vendor/shp.min.js"></script>
  <script src="/static/explore.js"></script>
  <script src="/static/symbology.js"></script>
  <script src="/static/geomops.js"></script>
  <script src="/static/gistools.js"></script>
  <script src="/static/charts.js"></script>
  <script src="/static/layout.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
